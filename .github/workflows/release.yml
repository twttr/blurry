name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          xcodebuild -scheme Blurry -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SENTRY_DSN="$SENTRY_DSN"

      - name: Create DMG
        run: |
          mkdir -p dmg-contents
          cp -R "build/Build/Products/Release/Blurry.app" dmg-contents/
          ln -s /Applications dmg-contents/Applications
          hdiutil create -volname "Blurry" -srcfolder dmg-contents \
            -ov -format UDZO "Blurry-${{ github.ref_name }}.dmg"

      - name: Create ZIP
        run: |
          cd "build/Build/Products/Release"
          zip -r -y "../../../../Blurry-${{ github.ref_name }}.zip" Blurry.app
          cd -

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blurry-${{ github.ref_name }}
          path: |
            *.dmg
            *.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.dmg
            *.zip
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_UPDATE_TOKEN }}
        run: |
          gh api repos/twttr/homebrew-apps/dispatches \
            --method POST \
            --field event_type=update-cask \
            -f client_payload[cask]=blurry \
            -f "client_payload[version]=${GITHUB_REF_NAME#v}" \
            -f client_payload[repo]=twttr/blurry
