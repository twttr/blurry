name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -scheme Blurry -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        run: |
          mkdir -p dmg-contents
          cp -R "build/Build/Products/Release/Blurry.app" dmg-contents/
          ln -s /Applications dmg-contents/Applications
          hdiutil create -volname "Blurry" -srcfolder dmg-contents \
            -ov -format UDZO "Blurry-${{ github.ref_name }}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blurry-${{ github.ref_name }}
          path: '*.dmg'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.dmg'
          generate_release_notes: true
